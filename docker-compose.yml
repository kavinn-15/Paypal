version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: cashflow-lifeline-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cashflow_lifeline}
      MYSQL_USER: ${MYSQL_USER:-cashflow_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cashflow_password}
    # Database port kept internal to Docker network for security
    expose:
      - "3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cashflow-lifeline-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-cashflow_user}:${MYSQL_PASSWORD:-cashflow_password}@mysql:3306/${MYSQL_DATABASE:-cashflow_lifeline}?charset=utf8mb4
      - PAYPAL_BASE_URL=https://api-m.sandbox.paypal.com
      - PORT=8000
      - WORKERS=${BACKEND_WORKERS:-2}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cashflow-lifeline-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mysql_data:
